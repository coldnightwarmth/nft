<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f0e8" />
    <title>Dratinis</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css?v=9" />
    <script type="module" src="./app.js?v=11"></script>
  </head>
  <body>
    <main id="viewport" aria-label="Dratini canvas. Scroll to zoom; drag to pan.">
      <canvas id="canvas" width="932" height="1006" role="img" aria-label="Randomly layered Dratinis"></canvas>
    </main>
    <form class="controls" aria-label="Canvas controls">
      <div class="layer-control">
        <label for="layers">Layers <output id="layer-count" for="layers">12</output></label>
        <input id="layers" type="range" min="1" max="99" value="12" disabled />
      </div>
      <div class="effects-control">
        <button id="effects-button" type="button" aria-label="Layer effects" aria-haspopup="dialog" aria-expanded="false" aria-controls="effects-panel" title="Layer effects">FX</button>
        <section id="effects-panel" role="dialog" aria-labelledby="effects-heading" hidden>
          <div class="effects-heading">
            <h2 id="effects-heading">Layer effects</h2>
            <button id="effects-close" type="button" aria-label="Close layer effects">×</button>
          </div>
          <div class="effect-list">
          <label class="effect-option"><span>Pixelation</span><input type="checkbox" role="switch" data-effect="pixelation" aria-label="Pixelation" /><span class="switch-track" aria-hidden="true"></span></label>
          <label class="effect-option"><span>Color overlay</span><input type="checkbox" role="switch" data-effect="overlay" aria-label="Color overlay" /><span class="switch-track" aria-hidden="true"></span></label>
          <label class="effect-option"><span>Field blur</span><input type="checkbox" role="switch" data-effect="blur" aria-label="Field blur" /><span class="switch-track" aria-hidden="true"></span></label>
          <label class="effect-option"><span>Color halftone</span><input type="checkbox" role="switch" data-effect="halftone" aria-label="Color halftone" /><span class="switch-track" aria-hidden="true"></span></label>
          <label class="effect-option"><span>Posterize</span><input type="checkbox" role="switch" data-effect="posterize" aria-label="Posterize" /><span class="switch-track" aria-hidden="true"></span></label>
          <label class="effect-option"><span>Duotone</span><input type="checkbox" role="switch" data-effect="duotone" aria-label="Duotone" /><span class="switch-track" aria-hidden="true"></span></label>
          <label class="effect-option"><span>Negative</span><input type="checkbox" role="switch" data-effect="negative" aria-label="Negative" /><span class="switch-track" aria-hidden="true"></span></label>
          <label class="effect-option"><span>Stencil</span><input type="checkbox" role="switch" data-effect="stencil" aria-label="Stencil" /><span class="switch-track" aria-hidden="true"></span></label>
          <label class="effect-option"><span>Ordered dithering</span><input type="checkbox" role="switch" data-effect="dither" aria-label="Ordered dithering" /><span class="switch-track" aria-hidden="true"></span></label>
          <label class="effect-option"><span>Engraving</span><input type="checkbox" role="switch" data-effect="engraving" aria-label="Engraving" /><span class="switch-track" aria-hidden="true"></span></label>
          <label class="effect-option"><span>ASCII art</span><input type="checkbox" role="switch" data-effect="ascii" aria-label="ASCII art" /><span class="switch-track" aria-hidden="true"></span></label>
          <label class="effect-option"><span>Neon edges</span><input type="checkbox" role="switch" data-effect="neon" aria-label="Neon edges" /><span class="switch-track" aria-hidden="true"></span></label>
          <label class="effect-option"><span>Chrome</span><input type="checkbox" role="switch" data-effect="chrome" aria-label="Chrome" /><span class="switch-track" aria-hidden="true"></span></label>
          <label class="effect-option"><span>Paper cutout</span><input type="checkbox" role="switch" data-effect="paper" aria-label="Paper cutout" /><span class="switch-track" aria-hidden="true"></span></label>
          <label class="effect-option"><span>Kaleidoscope</span><input type="checkbox" role="switch" data-effect="kaleidoscope" aria-label="Kaleidoscope" /><span class="switch-track" aria-hidden="true"></span></label>
          <label class="effect-option"><span>Swirl</span><input type="checkbox" role="switch" data-effect="swirl" aria-label="Swirl" /><span class="switch-track" aria-hidden="true"></span></label>
          <label class="effect-option"><span>Wave distortion</span><input type="checkbox" role="switch" data-effect="wave" aria-label="Wave distortion" /><span class="switch-track" aria-hidden="true"></span></label>
          </div>
          <div class="effect-chance">
            <label for="effect-chance">Chance per layer <output id="effect-chance-value" for="effect-chance">50%</output></label>
            <input id="effect-chance" type="range" min="0" max="100" value="50" step="1" />
          </div>
          <label class="effect-option eyes-option"><span>Enable eyes</span><input id="enable-eyes" type="checkbox" role="switch" aria-label="Enable eyes" disabled /><span class="switch-track" aria-hidden="true"></span></label>
        </section>
      </div>
      <label class="color-control" for="background" title="Background color">
        <span class="sr-only">Background color</span>
        <input id="background" type="color" value="#f3f0e8" />
      </label>
      <div class="zoom-controls" role="group" aria-label="Canvas zoom">
        <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
        <button id="zoom-reset" type="button" aria-label="Reset zoom to fit" title="Reset zoom to fit">100%</button>
        <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
      </div>
      <div class="generation-actions">
        <button id="regenerate" type="button" title="Regenerate · Right-click to go back (up to 10 generations)" disabled>
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M16 7a6.4 6.4 0 1 0 .2 5M16 3v4h-4" /></svg>
          <span>Regenerate</span>
        </button>
        <button id="reorder" type="button" title="Shuffle the current layers’ stacking order · Right-click to go back (up to 10 generations)" disabled>Reorder</button>
        <button id="shuffle-effects" type="button" aria-label="Shuffle effects" title="Reroll effects on the same layers · Right-click to go back (up to 10 generations)" disabled>Shuffle FX</button>
        <div class="favorites-actions">
        <button id="favorite-star" type="button" aria-label="Star current generation" aria-pressed="false" title="Favorite this generation" disabled>
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m10 2 2.5 5.1 5.6.8-4.1 4 .9 5.6-4.9-2.6-4.9 2.6.9-5.6-4.1-4 5.6-.8Z" /></svg>
        </button>
        <button id="favorites-button" type="button" aria-label="Open favorites (0 saved)" aria-haspopup="dialog" aria-expanded="false" aria-controls="favorites-panel" title="Favorites">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 2h6v6H2zM12 2h6v6h-6zM2 12h6v6H2zM12 12h6v6h-6z" /></svg>
        </button>
        <button id="download" type="button" aria-label="Download full-resolution PNG and layer JSON" title="Download PNG + layer JSON · 932 × 1006" disabled>
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M10 2v10m-4-4 4 4 4-4M3 13v4h14v-4" /></svg>
        </button>
        </div>
      </div>
    </form>
    <section id="favorites-panel" role="dialog" aria-labelledby="favorites-heading" hidden>
      <div class="favorites-heading">
        <h2 id="favorites-heading">Favorites <span id="favorites-count">0 / 500</span></h2>
        <button id="favorites-close" type="button" aria-label="Close favorites">×</button>
      </div>
      <div id="favorites-grid" aria-label="Favorite generations" aria-busy="false"></div>
      <p id="favorites-message" role="status" aria-live="polite" hidden></p>
      <button id="favorites-download" type="button" disabled>Download all · ZIP</button>
    </section>
    <p id="status" class="sr-only" role="status" aria-live="polite">Loading Dratinis…</p>
    <noscript>Enable JavaScript to generate Dratinis.</noscript>
  </body>
</html>
