<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>Dratinis · FX test</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./style.css?v=1" />
  <script type="module" src="./app.js?v=2"></script>
</head>
<body>
  <header class="toolbar">
    <div class="brand"><a href="../" aria-label="Back to Dratinis">← Dratinis</a><h1>FX test <span>20 effects × 4 layers</span></h1></div>
    <div class="tools">
      <label class="sr-only" for="jump">Jump to effect</label>
      <select id="jump"><option value="original">Originals</option></select>
      <label class="background-control" title="Preview background"><span class="sr-only">Preview background</span><input id="background" type="color" value="#f3f0e8" /></label>
      <button id="reroll" type="button" disabled>Reroll FX</button>
      <button id="new-samples" type="button" disabled>New samples</button>
    </div>
  </header>
  <main>
    <div class="gallery-info"><p>Four layers. Twenty ways to change them.</p><p id="status" role="status" aria-live="polite">Loading samples…</p></div>
    <div id="gallery" aria-busy="true"></div>
  </main>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="detail-heading"><div><h2 id="detail-title"></h2><p id="detail-source"></p></div><div class="detail-actions"><button id="save" type="button">PNG ↓</button><button id="close" type="button" aria-label="Close preview">×</button></div></div>
    <div class="detail-art"><canvas id="detail-canvas" width="932" height="1006" role="img"></canvas></div>
  </dialog>
  <noscript>Enable JavaScript to view the effect gallery.</noscript>
</body>
</html>
